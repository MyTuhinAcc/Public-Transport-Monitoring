
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-transport
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: public-transport
  template:
    metadata:
      labels:
        app: public-transport
    spec:
      containers:
        - name: public-transport
          image: tuhinnew/public-transport:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: public-transport-service
spec:
  type: NodePort
  selector:
    app: public-transport
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30085
